name: portal
description: "Portal Messenger Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  google_fonts: ^6.2.1
  firebase_core: ^3.10.0
  cloud_firestore: ^5.6.0
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  shared_preferences: ^2.3.4
  permission_handler: ^11.3.1
  record: ^5.0.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  record_platform_interface: 1.2.0
  record_linux: 0.7.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/portal.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/portal.png
